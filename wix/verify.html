<!DOCTYPE html>
<!--
  Levels Academy — certificate verification page.

  Lives inside the Wix /verify page as an HTML embed (HtmlComponent). The Velo
  page code (wix/verify-page.velo.js) reads ?v=<token> from the URL, calls the
  /_functions/verify backend, and postMessages the result here to render.

  Standalone fallback: open verify.html?v=<token> directly and it will fetch the
  endpoint itself (handy for testing). Set window.VERIFY_URL to override it.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verify certificate — Levels Academy</title>
<style>
  :root { --ink:#2b2b2b; --muted:#7a7a7a; --line:#ececec; --ok:#15a36a; --bad:#e0526a; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:transparent; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--ink); }
  .wrap { max-width:560px; margin:0 auto; padding:18px; }
  .card { border:1px solid var(--line); border-radius:16px; padding:26px 26px 22px; background:#fff;
          box-shadow:0 8px 30px rgba(20,20,40,.06); }
  .badge { display:inline-flex; align-items:center; gap:9px; font-weight:600; font-size:14px;
           padding:7px 13px; border-radius:999px; }
  .badge.ok  { color:var(--ok);  background:rgba(21,163,106,.10); }
  .badge.bad { color:var(--bad); background:rgba(224,82,106,.10); }
  .badge svg { width:16px; height:16px; }
  .name { font-size:30px; font-weight:700; line-height:1.15; margin:18px 0 2px; letter-spacing:.2px; }
  .sub  { color:var(--muted); font-size:14px; margin-bottom:20px; }
  .rows { border-top:1px solid var(--line); }
  .row  { display:flex; justify-content:space-between; gap:16px; padding:12px 0; border-bottom:1px solid var(--line); }
  .row .k { color:var(--muted); font-size:13px; text-transform:uppercase; letter-spacing:.5px; white-space:nowrap; }
  .row .v { font-weight:600; text-align:right; }
  .foot { margin-top:18px; color:var(--muted); font-size:12.5px; display:flex; justify-content:space-between; gap:10px; }
  .msg  { color:var(--muted); font-size:15px; margin-top:14px; line-height:1.5; }
  .hidden { display:none; }
  .center { text-align:center; padding:34px 10px; color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div id="state-loading" class="center">Checking certificate…</div>

    <div id="state-ok" class="hidden">
      <span class="badge ok">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        <span id="ok-label">Verified certificate</span>
      </span>
      <div class="name" id="ok-name"></div>
      <div class="sub" id="ok-sub"></div>
      <div class="rows" id="ok-rows"></div>
      <div class="foot"><span id="ok-issuer">Issued by Levels Academy</span><span id="ok-no"></span></div>
    </div>

    <div id="state-bad" class="hidden">
      <span class="badge bad">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/></svg>
        <span id="bad-label">Not verified</span>
      </span>
      <div class="msg" id="bad-msg"></div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var VERIFY_URL = window.VERIFY_URL || 'https://www.levels.ge/_functions/verify';

  var MONTHS = {
    en: ['January','February','March','April','May','June','July','August','September','October','November','December'],
    ka: ['იანვარი','თებერვალი','მარტი','აპრილი','მაისი','ივნისი','ივლისი','აგვისტო','სექტემბერი','ოქტომბერი','ნოემბერი','დეკემბერი']
  };
  // Per-language wording for the card (template 4 is Georgian).
  var T = {
    en: { verified:'Verified certificate', holder:'completed the course', course:'Course', level:'Level',
          hours:'Hours', period:'Period', no:'Certificate No.', issuer:'Issued by Levels Academy',
          notfound:'We couldn’t find a certificate for this code. Please check the QR code or link.',
          error:'We couldn’t verify right now. Please try again in a moment.', nocode:'No certificate code provided.' },
    ka: { verified:'დადასტურებული სერტიფიკატი', holder:'დაასრულა კურსი', course:'კურსი', level:'დონე',
          hours:'საათები', period:'პერიოდი', no:'სერტიფიკატის ნომერი', issuer:'გაცემულია Levels Academy-ის მიერ',
          notfound:'ამ კოდით სერტიფიკატი ვერ მოიძებნა. გთხოვთ შეამოწმოთ QR კოდი ან ბმული.',
          error:'ამჟამად ვერ მოხერხდა შემოწმება. სცადეთ ცოტა ხანში.', nocode:'სერტიფიკატის კოდი არ არის მითითებული.' }
  };

  function $(id) { return document.getElementById(id); }
  function show(which) { ['loading','ok','bad'].forEach(function (s) { $('state-' + s).className = (s === which ? '' : 'hidden'); }); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>]/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;' }[c]; }); }

  function fmtDate(iso, lang) {
    if (!iso) return '';
    var m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m) return String(iso);
    return parseInt(m[3], 10) + ' ' + MONTHS[lang][parseInt(m[2], 10) - 1] + ' ' + m[1];
  }

  function rowHtml(k, v) { return v ? '<div class="row"><span class="k">' + esc(k) + '</span><span class="v">' + esc(v) + '</span></div>' : ''; }

  function render(result) {
    if (!result) { var t0 = T.en; $('bad-msg').textContent = t0.error; show('bad'); return; }
    if (result.error) { $('bad-msg').textContent = T.en.error; show('bad'); return; }
    if (!result.found || !result.certificate) { $('bad-msg').textContent = T.en.notfound; show('bad'); return; }

    var c = result.certificate;
    var lang = (String(c.templateId) === '4') ? 'ka' : 'en';
    var t = T[lang];
    var name = (String(c.firstName || '').trim() + ' ' + String(c.lastName || '').trim()).trim();
    var period = c.startDate ? fmtDate(c.startDate, lang) + (c.endDate ? ' – ' + fmtDate(c.endDate, lang) : '') : '';

    $('ok-label').textContent = t.verified;
    $('ok-name').textContent = name;
    $('ok-sub').textContent = t.holder;
    $('ok-rows').innerHTML =
      rowHtml(t.course, c.course) + rowHtml(t.level, c.level) +
      rowHtml(t.hours, c.hours) + rowHtml(t.period, period);
    $('ok-issuer').textContent = t.issuer;
    $('ok-no').textContent = t.no + ' ' + (c.certNumber || '');
    show('ok');
  }

  function lookup(token) {
    if (!token) { $('bad-msg').textContent = T.en.nocode; show('bad'); return; }
    show('loading');
    fetch(VERIFY_URL + '?v=' + encodeURIComponent(token))
      .then(function (r) { return r.json(); })
      .then(render)
      .catch(function () { $('bad-msg').textContent = T.en.error; show('bad'); });
  }

  // 1) Embedded in Wix: the page (Velo) sends us the token or the full result.
  //    Ignore our own "ready" ping (on a top-level page parent === self).
  window.addEventListener('message', function (e) {
    var d = e.data || {};
    if (!d || d.source !== 'levels-verify' || d.ready) return;
    if (d.result) render(d.result);            // Velo already fetched it
    else if (d.token || d.id) lookup(d.token || d.id);
  });
  // Tell the Wix page we're ready to receive the token.
  try { window.parent.postMessage({ source: 'levels-verify', ready: true }, '*'); } catch (e) {}

  // 2) Standalone fallback: ?v=<token> in our own URL.
  var q = new URLSearchParams(location.search);
  var direct = q.get('v') || q.get('id');
  if (direct) lookup(direct);
})();
</script>
</body>
</html>
